[package]
name = "ai_processor"
version = "0.1.0"
edition = "2021"

[lib]
name = "ai_processor"
path = "src/lib.rs"
doctest = false

[dependencies]
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "signal", "time"] }
dashmap = "6"
rand = "0.8"
# Built with rust 1.88: ort rc.13 (the pinned 1.75-era rc.9 lock no
# longer compiles on current rustc — fn-pointer method calls were
# removed. rc.13 is the version that built the working images.)
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "ndarray"] }
libloading = "=0.8.6"
ndarray = "0.16"
num-traits = "0.2"
tokio-postgres = { version = "=0.7.10", features = ["with-chrono-0_4"] }
postgres-protocol = "=0.6.7"
chrono = "=0.4.31"
url = "=2.3.1"
uuid = { version = "=1.6.1", features = ["v4"] }
rayon = "1.10.0"

[[bin]]
name = "ai_processor"
path = "src/main.rs"

[[bin]]
name = "refresh_api"
path = "src/bin/refresh_api.rs"

# Integration test harness: pulls in all src/tests/ files as unit tests
# of the ai_processor lib, so they run alongside the normal lib tests.
[[test]]
name = "unit"
path = "tests/unit.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "classic_eval"
path = "src/bin/classic_eval.rs"
